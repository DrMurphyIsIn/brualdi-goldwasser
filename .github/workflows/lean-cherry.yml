# Kernel check of the cherry-regime formalization (formalization/cherry). Like `lean`, it runs ONLY on the
# maintainer's self-hosted runner, ONLY for pushes to main and manual dispatch, and never for pull requests:
# code from forks never runs on the self-hosted machine. This project is small (about 4 minutes, under 6 GB),
# so it runs only when its own files change.
name: lean-cherry

on:
  push:
    branches: [main]
    paths: [formalization/cherry/**, .github/workflows/lean-cherry.yml]
  workflow_dispatch:

concurrency:
  group: lean-cherry-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lean-cherry:
    if: github.repository == 'DrMurphyIsIn/brualdi-goldwasser' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, bg-lean]
    timeout-minutes: 240
    defaults:
      run:
        working-directory: formalization/cherry
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false          # keep .lake between runs; lake rebuilds only what changed
      - name: Seed .lake on first run
        run: |
          if [ ! -d .lake ] && [ -d "$HOME/bg-lake-seed" ]; then cp -cR "$HOME/bg-lake-seed" .lake; echo seeded; fi
      - name: Toolchain
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          elan show
      - name: Mathlib cache
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Build
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build
      # A `sorry` would show up as sorryAx and `native_decide` as Lean.ofReduceBool, so this check covers both.
      - name: Axioms of every headline theorem
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean AxiomGuard.lean | tee axioms.txt
          # every headline may use only (a subset of) the three standard axioms
          bad=$(grep "depends on axioms" axioms.txt | sed 's/.*\[\(.*\)\].*/\1/' | tr ',' '\n' | tr -d ' ' \
                | grep -v -x -e propext -e Classical.choice -e Quot.sound || true)
          if [ -n "$bad" ]; then echo "non-standard axiom found: $bad"; exit 1; fi
          # one result per headline listed in AxiomGuard.lean (no headline may silently drop out)
          expected=$(grep -c '^#print axioms' AxiomGuard.lean)
          got=$(grep -c -e 'depends on axioms' -e 'does not depend on any axioms' axioms.txt)
          echo "axiom reports: $got of $expected"
          test "$got" -eq "$expected"
