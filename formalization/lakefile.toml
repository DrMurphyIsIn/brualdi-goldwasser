name = "R3Cert"
defaultTargets = ["R3Cert"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

# The import closure of R3Cert.BGMaximizerAll.bg_maximizer_all (module names kept from the
# development repository DrMurphyIsIn/Arda, proof/formalization/R3Cert, for traceability).
[[lean_lib]]
name = "R3Cert"
globs = ["R3Cert.+"]

# The Comparator challenge (statement only) and solution (proof); see comparator/README.md.
[[lean_lib]]
name = "BGComparator"
srcDir = "comparator"
roots = ["BGChallenge", "BGSolution"]

# Uniqueness of the maximizer, every n >= 4 (n = 21: exactly two trees), up to isomorphism; not a default target,
# built by its own workflow (bg-unique.yml).
[[lean_lib]]
name = "BGUnique"
globs = ["BGUnique.+"]

# The Comparator challenge for uniqueness (statement only, Mathlib vocabulary), its solution, and three negative
# controls; see comparator/README.md. Not a default target.
[[lean_lib]]
name = "BGUniqueComparator"
srcDir = "comparator"
roots = ["BGUniqueChallenge", "BGUniqueSolution", "BGUniqueNegAt21", "BGUniqueNegOneClass21", "BGUniqueNegEveryTree"]
